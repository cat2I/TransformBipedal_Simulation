# Cấu hình công cụ cho isaac_rl.
#
# File này PHẢI nằm ở gốc isaac_rl: pytest lấy thư mục chứa
# [tool.pytest.ini_options] làm rootdir, nhờ đó
# scripts/test_officialdesign_asset.py mới import được prepare_officialdesign.
#
# Bản gốc là config của IsaacLab upstream (~130 dòng: codespell, isort theo
# extension isaaclab, pydocstyle, mimic...). Đã cắt còn những thứ project
# thực sự dùng. Bản đầy đủ xem trong lịch sử git nếu cần.

[tool.pytest.ini_options]
testpaths = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["logs", "_archive", ".vscode"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "SIM", "RET"]
ignore = [
    "E402",   # import không ở đầu file — bắt buộc với Isaac: phải AppLauncher trước
    "RET504", # gán biến rồi mới return
    "RET505", # elif sau return
    "SIM108", # ép dùng toán tử ba ngôi
    "SIM117", # gộp các with
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # __init__ được phép import mà không dùng

[tool.pyright]
include = ["source", "scripts"]   # TODO: đổi khi dọn xong cấu trúc thư mục
exclude = ["**/__pycache__", "**/logs", "_archive"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
# Pyright không có Isaac Sim / torch trong môi trường của nó
reportMissingImports = "none"
reportMissingModuleSource = "none"
